[package]
name = "mnema-server"
version = "0.0.1"
edition = "2024"
description = "Mnema REST API and embedded web interface"
license = "Apache-2.0"

[dependencies]
mnema-app = { path = "../app" }
mnema-core = { path = "../core" }
mnema-infra = { path = "../infra" }

anyhow = "1"
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
time-tz = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
