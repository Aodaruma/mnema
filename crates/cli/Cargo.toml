[package]
name = "mnema-cli"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "mnema"
path = "src/main.rs"

[dependencies]
mnema-core = { path = "../core" }
mnema-app = { path = "../app" }
mnema-infra = { path = "../infra" }

anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
time-tz = "2"
tokio = { version = "1.48", features = ["full"] }
uuid = { workspace = true }

